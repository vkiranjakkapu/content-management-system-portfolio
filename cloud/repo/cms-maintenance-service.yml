database:
    name: cms_maintenance

eureka:
    client:
        webclient:
            enabled: true

spring:
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB

config:
    storage:
        # provider: local
        # local:
        #     base-path: "filestore"
        provider: azure
        azure:
            connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
            container-name: ${AZURE_STORAGE_CONTAINER}
    media:
        allowed-exts: [png, jpg, jpeg, gif]
